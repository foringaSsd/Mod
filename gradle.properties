# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.20.1
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Yarn mappings — the mod's source code is written against these names,
# not officialMojangMappings(). 1.20.1+build.10 is the standard Yarn
# build for this Minecraft version; check fabricmc.net/develop if you
# want to confirm a newer build number is available.
yarn_mappings=1.20.1+build.10

# Mod Properties
mod_version=1.0.0
maven_group=com.bossrush

# Dependencies
fabric_api_version=0.92.11+1.20.1
archives_base_name=bossrush
